risk_none_multiplier = 1.0   # 风险等级系数（回测管线使用 → EngineConfig.risk_none_multiplier）


[BACKTEST_CALIBRATED]
# ── 回测自动校准参数（Walk-Forward 寻优后自动覆写 FULL_BULL_SCORING 对应项） ──
# 以下参数由回测引擎在 Walk-Forward 校准期间自动搜索最优值，
# 并写回本分区。日常运行无需手动修改。
# ⚠️ 手动修改后，下次回测校准会被覆写。
boll_narrow_ratio = 0.9  # 窄布林判定：带宽/历史均值 < 此值 → 震荡
cross_decay_days = 32  # 金叉信号衰减半衰期（天）
atr_stop_mult = 2.5  # ATR 止损倍数：止损价 = close - ATR × 此值
learned_t1_mult = 4.0         # VAEO 学习产出：T1 止盈倍数 = close + ATR × 此值
learned_t2_mult = 5.0         # VAEO 学习产出：T2 止盈倍数 = close + ATR × 此值
liq_veto_ratio = 0.065      # 流动性否决比
kelly_fraction = 0.3        # 半凯利系数
position_a = 0.35           # A 级（综合多头）基础仓位
conclusion_full_bull = 78  # MACD 综合评分 ≥ 此值 → A 级
golden_cross_bonus = 10     # R04: 金叉量价确认加分
divergence_penalty = 20     # R41: 顶背离量缩扣分
risk_none_multiplier = 1.0  # NONE 风险等级仓位系数


