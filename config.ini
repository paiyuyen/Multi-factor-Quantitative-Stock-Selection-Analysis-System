csrc_fee_rate = 0.00002        # 证管费（双边，万0.2）
stamp_tax_segments = 2023-08-28:0.0005;2000-01-01:0.001   # 印花税日期分段表（date:rate;...，卖出单向）


[POSITION_BACKTEST]
# ── 历史交易记录回测 ──
# 格式：股票代码|入仓时间(YYYYMMDD)|股数|[成交价]|[方向]
# 支持 # // -- 行注释，空行跳过
pool_file_path = 证券交割单.xlsx


[API]
# ── REST API 服务 ──
enabled = 0
host = 127.0.0.1
port = 8000
alert_webhook_url =
alert_channel = generic
alert_on_failure = 1
alert_on_success = 0


[BACKTEST]
# ── 回测系统调度参数 ──
enabled = true                       # 是否启用定时回测寻优
optimize_frequency = monthly         # Walk-Forward 校准频率
backtest_start_date = 20230101       # 回测数据起始日期
out_of_sample_days = 60              # Walk-Forward 样本外验证窗口（60天≈3个月，确保5条路径可达：(_wfo_total-180-embargo)//60 ≥ 5）
holdout_ratio = 0.20                 # 末段独立 holdout 占正式回测交易日比例（0.20=末段20%对WFO全程禁触，终验只在此段进行；0.0=禁用回退旧逻辑）
initial_cash = 1000000               # 回测初始资金
signal_pipelines = 6                 # 信号预计算并行管道数
wfo_num_paths = 5                    # Walk-Forward 多路径数（P1-16 提升至5，<5时回测拦截）
exclude_st = true                     # 回测宇宙剔除 ST/*ST 风险警示股
transfer_fee_rate = 0.00001          # 过户费（双向，万0.1）
min_commission_per_trade = 5.0       # 每笔最低佣金（5元）
max_position_pct = 0.1               # 单票仓位比例上限（每只标的最高占当前总资产10%）

# ── 贝叶斯优化预算 ──
bayesian_n_init_signal = 12          # 信号参数 Sobol 初始采样
bayesian_n_iter_signal = 24          # 信号参数贝叶斯迭代
bayesian_n_init_portfolio = 20       # 组合参数初始采样
bayesian_n_iter_portfolio = 60       # 组合参数贝叶斯迭代

# ── P2.1 CPCV 净化 + 禁运 ──
bayesian_cpcv_purge_days = 5         # 训练窗口尾部净化天数（前向收益标签视界）
bayesian_cpcv_embargo_days = 3       # 训练结束与 OOS 开始之间的禁运间隔（天）

# ── P2.4 时间预算 / 早停 ──
bayesian_time_budget_seconds = 28800 # 整个 WFO 寻优时间预算（8 小时，超时强制停止）
bayesian_max_no_improve_windows = 3  # 连续无改善窗口数达到该值提前终止

# ── A2 失败快照持久化（窗口无效/异常时落盘可复现输入，供本地复现） ──
snapshot_enabled = true            # 开关：false 时失败只记日志不落盘
snapshot_max_rows = 200            # 快照 OHLCV 截断行数（最近 N 行）
snapshot_retention_days = 14       # 快照保留天数，过期自动清理并告警

# ── 窗口预检与容错（指标计算前判断序列可计算性） ──
# STRICT=任何可疑一律SKIP（宁可错杀） / RELAX=硬失败SKIP+可修复填充+软问题放行 / OFF=完全关闭（回退开关）
precheck_mode = RELAX

# ── Task F 交易日历与停牌标志对齐 ──
# on=合并时按官方日历对齐（is_trading/is_suspended 标志 + 停牌比例日历口径 SKIP + 引擎日轴=交易所日历）
# off=回退老版合并逻辑（无标志列、启发式停牌检测、按数据日轴迭代）
calendar_align_mode = on
calendar_ttl_hours = 24   # 官方交易日历本地缓存有效期（小时），过期后维护时重新拉取

# ── 指标计算降级（样本不足时 min_periods 缩窗 + 置信度标签） ──
# STRICT=原周期全窗计算（头部NaN，原行为） / RELAX=缩窗计算并标 low_confidence / SKIP=标低置信由策略层跳过
indicator_degradation = RELAX
indicator_degradation_low_action = skip   # 低置信度信号处理: skip 不下单 / low_weight 按系数降权
indicator_degradation_low_weight = 0.5    # 降权系数

# ── ATR 风险驱动仓位控制（A4） ──
risk_per_trade = 0.02          # 单笔风险占总资金比例（默认2%）

# ── 成交时点模型（0.1 执行时序合规） ──
# next_open=信号次日开盘价成交（默认，符合A股T+1）
# vwap=信号次日VWAP成交。next_open/vwap 下单挂至次日开盘撮合，次日一字涨停不可买、一字跌停不可卖。
# close 模式已移除（固有前视偏差：信号依赖当日收盘数据计算，以同日收盘价成交=先知交易）
execution_model = next_open

# ── 市场过滤器（大盘风控开关） ──
# 基于股票池整体 MA20 多头比例，在弱势市场中强制空仓观望，锁住最大回撤
market_filter_enabled = true          # 是否启用市场过滤器
market_filter_bull_ratio = 0.55        # 多头阈值：>55%标的站上MA20视为牛市
market_filter_min_stocks = 10         # 最少有效标的数（样本不足的日跳过过滤）

# ── 涨跌停撮合约束（可成交量规则，提升成交模拟真实度） ──
# true=触板日按可成交量比例部分成交/未成交（[撮合约束] 日志可追溯）
# false=回退简化撮合（涨停禁买/跌停禁卖，等价旧行为）
simulate_limit_up_down = true
limit_seal_ratio = 0.05        # [deprecated] 保留兼容
# P1-2 修复：一字板封死买卖方向独立——涨停板买入极难（逆势排队），卖出相对容易（提供流动性）
limit_seal_sell_ratio = 0.05   # 一字封板卖出可成交量比例（提供流动性，相对容易）
limit_seal_buy_ratio = 0.02    # 一字封板买入可成交量比例（逆势排队，极难）
# P1-2 修复：涨跌停方向流动性不对称——涨停开盘买方排队深，买方成交难；
# 跌停开盘恐慌抛压，卖方成交困难但炸板后流动性通常好于涨停封板。
limit_tradable_up_ratio = 0.30  # 涨停开盘触板可成交量比例（买方保守）
limit_tradable_down_ratio = 0.30  # 跌停开盘触板可成交量比例
limit_intraday_ratio = 0.10    # 盘中冲板可成交量比例
limit_seal_decay = 0.5         # 连续板每板可成交量衰减系数

# ── 经验填充模型（涨跌停可成交量比例的经验校准，替代固定比例常量的技术债修复） ──
# fixed            = 旧行为：以上固定比例常量建模（0.05/0.30/0.10/0.12 缺经验依据）
# empirical_median = 历史日线 V_t/V_prev 中位数（中性口径；竞价触板日可成交量=前日量×p50）
# empirical_p10    = 历史 10% 分位（worst-case 保守口径，暴露流动性枯竭成本）
# 说明：分钟/tick/盘口数据不在数据源内，经验分位是可行的统计替代；单元格样本
# 不足 limit_calib_min_samples 回退 fixed 档；校准表全样本静态统计（应用无前视）
limit_ratio_mode = fixed
limit_calib_min_samples = 20   # 经验单元格最少样本数（不足回退 fixed 档）

# ── 涨跌停专项压力测试（一字涨停/竞价触板/炸板高发窗口 worst-case 成本报告） ──
limit_stress_enabled = true

# ── P3 审计修复：流动性分档参数 — 单只股票单笔成交不超过当日成交量比例 ──
# 避免大单冲击价，按市值/流动性分档限制最大下单量
max_order_pct = 0.30           # 单笔买单不超过当日成交量的 30%（默认）
max_order_pct_high = 0.20      # 高流动性股（日均成交额>1亿）上限 20%
max_order_pct_low = 0.10       # 低流动性股（日均成交额<2000万）上限 10%

# ── 复牌跳空（停牌后复牌日开盘大幅跳空：补涨兑现 / 补跌标记 / 追高禁买） ──
# 0=关闭对应方向的决策（仅识别复牌不动作）
resume_gap_up = 0.05        # 复牌高开≥该比例 → 开盘兑现卖出 + 当日禁买
resume_gap_down = 0.05      # 复牌低开≤-该比例 → 日志标记（风控卖出照常）
# P1-6 修复：复牌跳空卖出流动性冲击放大系数（复牌日流动性不足，冲击成本放大）
resume_impact_multiplier = 2.0
# P2-5 修复：复牌跳空买入集合竞价成交率（复牌日买方抢筹激烈，实际成交受限）
resume_auction_fill_ratio = 0.15

# ── P2-1 停牌盯市：停牌天数保守衰减折扣（无行业指数数据时的务实替代方案） ──
# 停牌天数 > susp_decay_start_days 时，盯市价按指数衰减折扣，防止长期停牌净值虚高
susp_decay_start_days = 10      # 停牌超过此交易日数开始衰减
susp_daily_decay_rate = 0.002   # 每日衰减率 0.2%（复利；年化 ~47% 保守折扣）
susp_max_discount = 0.30        # 最大折扣上限 30%（防止极端停牌过度压低净值）

# ── 统一交易成本（单一来源 CostModel；印花税分段表驱动，替代硬编码 2023-08-28） ──
# 注：与 [TRADING_COST] 节费率并存时，以 [TRADING_COST] 为准（[TRADING_COST] 为统一成本来源）
handling_fee_rate = 0.0000341  # 经手费（双边，万0.341）
csrc_fee_rate = 0.00002        # 证管费（双边，万0.2）
stamp_tax_segments = 2023-08-28:0.0005;2000-01-01:0.001   # 印花税日期分段表（date:rate;...，卖出单向）

# ── 寻优参数范围 (min,max,step) ──
# 回测引擎遍历所有组合，最优值自动写入 [BACKTEST_CALIBRATED]
# 趋势 + 止损
atr_stop_mult_range = 3.0,8.0,0.5       # ATR 止损倍数（P0修复：跟踪止损下放宽至 3-8 倍）
boll_narrow_ratio_range = 0.6,1.2,0.1   # 窄布林阈值
cross_decay_days_range = 3,60,3          # 金叉衰减天数（审计修复：上限从30扩展至60，覆盖已知最优值37）

# 仓位 + 风控
kelly_fraction_range = 0.05,0.5,0.05    # 半凯利系数（更细粒度）
position_a_range = 0.1,0.6,0.05         # A 级仓位（扩大范围）
liq_veto_ratio_range = 0.03,0.10,0.01   # 流动性否决比
conclusion_full_bull_range = 60,95,5    # A 级评分阈值
risk_none_multiplier_range = 0.5,2.0,0.25 # NONE 风险系数
